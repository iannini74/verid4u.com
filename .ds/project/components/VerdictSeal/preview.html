    border: 1px solid var(--c); border-radius: var(--radius-lg);
    padding: var(--space-5); text-align: center;
  }
  .seal-card svg { width: 44px; height: 44px; display: block; margin: 0 auto var(--space-3); }
  .seal-name {
    font-family: var(--font-display, "Inter Tight", sans-serif);

  }
